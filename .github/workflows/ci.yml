name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Report toolchain
        run: swift --version

      - name: Check iOS translation extension memory support
        run: bash Engine/Translation/Scripts/check-extension-memory.sh

      - name: Test MurmurKit
        run: cd MurmurKit && swift test

      - name: Test the engine packages
        run: |
          swift test --package-path Engine/Core
          swift test --package-path Engine/Translation
          swift test --package-path Engine/Session
          swift test --package-path Engine/Whistle
          swift test --package-path Engine/Cloud

      - name: Verify pinned quality catalogs and release gate
        run: |
          node Engine/Translation/Scripts/generate-quality-baseline.mjs --check
          node Engine/Translation/Qualification/validate-audit.mjs
          python3 -m unittest discover -s Engine/Speech/Qualification -p 'test_*.py'

      - name: Verify the offered Bergamot source archive
        run: node Applications/iOS/scripts/prepare-legal-resources.mjs --check

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate release configuration
        run: ./scripts/release-check.sh
